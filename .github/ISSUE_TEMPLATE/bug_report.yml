name: Bug in the code
description: Report a problem in the analyzer, tests, rules, or documentation.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please read [CONTRIBUTING.md](https://github.com/miixms99/email-security-filter-rules/blob/main/CONTRIBUTING.md) first.

        Never paste real email content, personal addresses, names, headers with personal data, or tracking links. Use redacted or made-up examples only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: Required. Issues that contain personal data may be edited or closed.
      options:
        - label: I confirm this issue contains no personal data, no real email content, no names or personal addresses, and no headers or tracking links with personal information. Any examples are redacted or synthetic.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in plain words.
      placeholder: The analyzer missed a signal, a test failed, or a rule behaved unexpectedly…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps or a redacted/synthetic example only. Do not paste a real message.
      placeholder: 1. Run `node scripts/run-tests.cjs`… or attach a made-up sample with placeholders such as [EMAIL] and [TOKEN].
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: For example Node version, operating system, or the command you ran.
    validations:
      required: false
