name: Idea or new signal
description: Propose a detection idea, a new rule, or an improvement.
title: "[Idea] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please read [CONTRIBUTING.md](https://github.com/miixms99/mailshield/blob/main/CONTRIBUTING.md) first.

        Never paste real email content, personal addresses, names, headers with personal data, or tracking links. Describe a general pattern, and use redacted or made-up examples only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: Required. Issues that contain personal data may be edited or closed.
      options:
        - label: I confirm this issue contains no personal data, no real email content, no names or personal addresses, and no headers or tracking links with personal information. Any examples are redacted or synthetic.
          required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should we add or change? For a new signal, describe the general pattern (for example a lure phrase type, a sender pattern, or a lookalike domain style).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: What problem would this catch or improve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example pattern (optional)
      description: A redacted or synthetic example only. Use placeholders such as [NAME], [EMAIL], or [TOKEN]. Do not paste a real message.
      placeholder: Sender looks like outlet@<rotating-domain>, subject mentions “free spins”, amount written as €1,25O…
    validations:
      required: false
