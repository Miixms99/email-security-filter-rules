name: Publish reviewed signal-only rule
on:
  workflow_dispatch:
    inputs:
      submission:
        description: Reviewed public-safe candidate and evidence attestations
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-reviewed-rule
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/prepare-publication.cjs
        env:
          RULE_SUBMISSION: ${{ inputs.submission }}
      - name: Syntax-check, validate rules, and run tests
        run: node scripts/run-tests.cjs
      - name: Commit validated rule
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/filter-rules.json
          git commit -m 'rules: publish reviewed signal-only candidate'
          git push origin HEAD:main
