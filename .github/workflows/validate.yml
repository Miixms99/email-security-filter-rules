name: Validate email security project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/Controle-Email.cjs
      - run: node scripts/Controle-Email.cjs --self-test
      - run: node scripts/Controle-Email.cjs --evaluate
      - run: node tests/project.test.cjs
      - run: node tests/publication.test.cjs
      - run: node tests/sync-chain.test.cjs
      - run: node tests/rule-learning.test.cjs


